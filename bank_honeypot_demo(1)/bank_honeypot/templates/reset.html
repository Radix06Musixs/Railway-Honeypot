{% extends "base.html" %}
{% block title %}Reset Password - Aurora Bank{% endblock %}
{% block body %}
<form class="form" method="post" action="/reset"><h2 style="margin-top:0">Reset password</h2>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<p style="color:#5d6b7a;font-size:.9rem">Demo mode: e-mails are not really sent. Read your code in the <a href="/demo-inbox" target="_blank">Demo Inbox</a>.</p>
<label>Customer ID or e-mail</label><input name="identifier" value="{{ ident }}">
<label>6-digit code</label><input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
<label>New password</label><input name="password" type="password" autocomplete="new-password">
<label>Confirm new password</label><input name="confirm" type="password" autocomplete="new-password">
<button class="btn" style="width:100%">Update password</button></form>
{% endblock %}
